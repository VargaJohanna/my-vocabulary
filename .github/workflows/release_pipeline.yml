name: Release Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run Tests
      env:
        QUOTE_API_KEY: ${{ secrets.QUOTE_API_KEY }}
      run: ./gradlew test

    - name: Increment Version Code
      if: success()
      run: |
        # Rational approach: Use sed to find the versionCode line and increment the integer
        current_version=$(grep "versionCode =" app/build.gradle | sed 's/[^0-9]*//g')
        new_version=$((current_version + 1))
        sed -i "s/versionCode = $current_version/versionCode = $new_version/g" app/build.gradle
        echo "New version code: $new_version"

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2
      id: android_keystore
      with:
        fileName: 'release-keystore.jks'
        fileDir: './app/'
        encodedString: ${{ secrets.KEYSTORE_FILE }}

    - name: Verify Keystore File
      run: |
        if [ ! -f "app/release-keystore.jks" ]; then
          echo "ERROR: app/release-keystore.jks was not generated!"
          exit 1
        fi
        echo "Keystore file created successfully. Size: $(wc -c < app/release-keystore.jks) bytes"

    - name: Build App Bundle (AAB)
      if: success()
      env:
        QUOTE_API_KEY: ${{ secrets.QUOTE_API_KEY }}
        GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease

    - name: Save App Bundle as Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release-bundle
        path: app/build/outputs/bundle/release/*.aab

    - name: Commit and Push Version Bump
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle
        git commit -m "build: bump versionCode [skip ci]"
        git push
