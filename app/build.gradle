apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-android-extensions'

apply plugin: 'kotlin-kapt'

apply plugin: 'androidx.navigation.safeargs'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.vocabulary.myvocabulary"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 21
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
    }

    androidExtensions {
        experimental = true
    }

    kapt {
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }
    }
}

dependencies {
    def room_version = "2.0.0"
    def lifecycle_version = "2.0.0"
    def nav_version = "1.0.0"
    def lottie_version = "3.0.0"
    def constraint_layout_version = "1.1.3"
    def material_version = "1.0.0"
    def card_view_version = "1.0.0"
    def rx_android_version = "2.0.1"
    def rx_java_version = "2.0.8"
    def junit_version = "4.12"
    def androidx_test_version = "1.1.1"
    def espresso_version = "3.1.1"
    def mockito_core_version = "2.15.0"
    def mockito_kotlin_version = "2.1.0"
    def assertj_core_version = "3.12.2"
    def core_ktx_version = "1.0.1"
    def koin_core_version = "2.0.0-beta-1"
    def material_about_version = "0.2.3"
    def rx_preferences_version = "2.0.0"
    def retrofit_version = "2.5.0"
    def apache_csv_version = "1.6"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraint_layout_version"
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.cardview:cardview:$card_view_version"

    //Room
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava2:$room_version"

    //RxJava
    implementation "io.reactivex.rxjava2:rxandroid:$rx_android_version"
    implementation "io.reactivex.rxjava2:rxjava:$rx_java_version"

    //Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"

    //Espresso
    testImplementation "junit:junit:$junit_version"
    androidTestImplementation "androidx.test:runner:$androidx_test_version"
    androidTestImplementation "androidx.test:rules:$androidx_test_version"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso_version"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:$espresso_version"

    //Mockito
    testImplementation "org.mockito:mockito-core:$mockito_core_version"
    testImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:$mockito_kotlin_version"
    testImplementation "androidx.arch.core:core-testing:$lifecycle_version"
    testImplementation "org.assertj:assertj-core:$assertj_core_version"

    //ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"

    //Navigation
    implementation "androidx.core:core-ktx:$core_ktx_version"
    implementation "android.arch.navigation:navigation-fragment-ktx:$nav_version"
    implementation "android.arch.navigation:navigation-ui-ktx:$nav_version"

    //Koin
    implementation "org.koin:koin-core:$koin_core_version"
    implementation "org.koin:koin-core-ext:$koin_core_version"
    implementation "org.koin:koin-androidx-scope:$koin_core_version"
    implementation "org.koin:koin-androidx-viewmodel:$koin_core_version"

    //Lottie animation
    implementation "com.airbnb.android:lottie:$lottie_version"

    //About page
    implementation "com.github.jrvansuita:MaterialAbout:$material_about_version"

    //Share preferences
    implementation "com.f2prateek.rx.preferences2:rx-preferences:$rx_preferences_version"

    //Apache CSV
    implementation "org.apache.commons:commons-csv:$apache_csv_version"
}
