<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Varga Johanna - Android Developer">
    <title>Varga Johanna - Android Developer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            color: #2b2838;
            background: #f7f5fc;
        }

        .container {
            width: 100%;
            max-width: 520px;
            padding: 48px 32px;

            background: #ffffff;
            border-radius: 16px;

            box-shadow: 0 8px 30px rgba(60, 45, 100, 0.08);

            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #292638;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #7466b8;
        }

        .skills {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #777286;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 36px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px 20px;

            border-radius: 8px;

            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                background-color 0.15s ease,
                border-color 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(60, 45, 100, 0.12);
        }

        .btn-english {
            background-color: #7466b8;
            color: #ffffff;
        }

        .btn-english:hover {
            background-color: #62569f;
        }

        .btn-hungarian {
            background-color: #ffffff;
            color: #7466b8;
            border: 1.5px solid #b5a9e8;
        }

        .btn-hungarian:hover {
            background-color: #f7f5fc;
            border-color: #7466b8;
        }

        .btn-linkedin {
            background-color: #ffffff;
            color: #7466b8;
            border: 1.5px solid #b5a9e8;
            margin-top: 8px;
        }

        .btn-linkedin:hover {
            background-color: #f7f5fc;
            border-color: #7466b8;
        }

        .footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #aaa5b5;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .container {
                padding: 32px 20px;
            }

            h1 {
                font-size: 1.75rem;
            }

            .links {
                margin-top: 28px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <h1>Varga Johanna</h1>

    <div class="subtitle">
        Android Developer
    </div>

    <div class="skills">
        Kotlin · Jetpack Compose · Android
    </div>

    <div class="links">

        <!-- English CV -->
        <a
                href="/files/varga_johanna_cv_en.pdf"
                download
                class="btn btn-english">
            🇬🇧&nbsp; English CV
        </a>

        <!-- Hungarian CV -->
        <a
                href="/files/varga_johanna_cv_hu.pdf"
                download
                class="btn btn-hungarian">
            🇭🇺&nbsp; Magyar CV
        </a>

        <!-- LinkedIn -->
        <a
                href="https://www.linkedin.com/in/johanna-varga/"
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-linkedin">
            LinkedIn
        </a>

    </div>

    <div class="footer">
        Android Developer · Budapest
    </div>

</main>

</body>
</html>
