[versions]
# Core
kotlin = "2.4.10"
agp = "9.4.0"
ksp = "2.3.11" # Matching Kotlin 2.4.10
gms-google-services = "4.5.0"

# AndroidX
ktx = "1.17.0"
lifecycle = "2.2.0"
lifecycleViewmodelCompose = "2.9.4"
navigation = "2.10.0"
test-ext-junit = "1.3.0"
androidx-credentials = "1.6.0"

# Firebase
firebaseBom = "34.19.0"

# Google ID
google-id = "1.2.1"
# Compose
composeBom = "2026.01.00"
material3-new = "1.5.0-alpha10"
material = "1.14.0"
uiGraphics = "1.10.1"
navigation-compose = "2.9.6"
activityCompose = "1.11.0"

# Jetpack DataStore
datastore = "1.2.1"

# KotlinX
serialization = "1.9.0"
lifecycle-runtime-compose = "2.8.7"

# Dependency Injection
koin = "4.1.1"

# Database
room = "2.8.4"
room-testing = "2.8.4"

# Networking
retrofit = "3.0.0"
okhttp-logging = "5.5.0"

# Utilities
lottie-compose = "6.7.1"
apache-csv = "1.14.1"
material-about = "0.2.3"

# Testing
mockk = "1.14.9"
junit5 = "5.13.4"
google-truth = "1.4.5"
androidx-test-core = "1.6.1"
junit = "4.13.2"
androidx-test = "1.7.0"
espresso = "3.7.0"
mockito-kotlin = "2.2.0"
assertj-core = "3.27.6"
turbine = "1.2.1"
coroutine-test = "1.11.0"
assertk = "0.28.1"

# Coroutine
coroutines = "1.10.2"
animation = "1.11.4"

[libraries]
# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Compose UI
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-compose-material-iconsExtended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# Compose Material
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3-new" }
androidx-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Compose Runtime
androidx-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }

# Jetpack Datastore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Credentials
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "google-id" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore-ktx" }

# Navigation & Activity
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# Lifecycle
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-runtime-compose" }

# Kotlin
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization"}
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines"}

# Dependency Injection
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "uiGraphics" }
# Database
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Networking
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp-logging" }

# Utilities
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie-compose" }
material-about = { group = "com.github.jrvansuita", name = "MaterialAbout", version.ref = "material-about" }
commons-csv = { group = "org.apache.commons", name = "commons-csv", version.ref = "apache-csv" }

# Testing
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
google-truth = { group = "com.google.truth", name = "truth", version.ref = "google-truth" }
room-testing = {group = "androidx.room", name = "room-testing", version.ref = "room-testing"}
test-core = {group = "androidx.test", name = "core", version.ref = "androidx-test-core"}
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espresso" }
mockito-kotlin = { group = "com.nhaarman.mockitokotlin2", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "lifecycle" }
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertj-core" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "animation" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutine-test" }
assertk = { group = "com.willowtreeapps.assertk", name = "assertk-jvm", version.ref = "assertk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
google-services = { id = "com.google.gms.google-services", version.ref = "gms-google-services" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
room = { id = "androidx.room", version.ref = "room" }
